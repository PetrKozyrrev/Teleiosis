# Explicit overlay, enabled only via TELEIOSIS_STAGING=1.
x-capture-environment: &capture-environment
  APP_ENV: staging
  EMAIL_BACKEND: capture
  CAPTURE_EMAIL_DIR: /var/lib/teleiosis/captured-mail

services:
  migrate:
    image: ${TELEIOSIS_API_IMAGE:-${TELEIOSIS_IMAGE:-teleiosis:local}}
    environment: *capture-environment
  mail-init:
    image: ${TELEIOSIS_IMAGE:-teleiosis:local}
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - capture_mail:/var/lib/teleiosis/captured-mail
    command:
      - python
      - -c
      - "import os; p='/var/lib/teleiosis/captured-mail'; os.chmod(p, 0o700); os.chown(p, 10001, 10001)"
  api:
    image: ${TELEIOSIS_API_IMAGE:-${TELEIOSIS_IMAGE:-teleiosis:local}}
    environment: *capture-environment
    volumes:
      - capture_mail:/var/lib/teleiosis/captured-mail
      - pdf_objects:/var/lib/teleiosis/pdf
      - pdf_scanner_socket:/run/pdf-scanner:ro
    depends_on:
      mail-init:
        condition: service_completed_successfully
  worker:
    environment: *capture-environment
    volumes:
      - capture_mail:/var/lib/teleiosis/captured-mail
    depends_on:
      mail-init:
        condition: service_completed_successfully
  proxy:
    # Ordinary `up` cannot publish the staged app before explicit approval.
    profiles: [public]
    environment:
      STAGING_AUTH_HASH: ${STAGING_AUTH_HASH:?Set STAGING_AUTH_HASH}
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
  pdf-scanner:
    profiles: [pdf]
    image: clamav/clamav:stable@sha256:12177441d1b40cef3c47b44c4090d59d4babc4c67bedd5af0fa315e603aa6dd8
    restart: unless-stopped
    mem_limit: 2300m
    environment:
      FRESHCLAM_CHECKS: "2"
    healthcheck:
      test: ["CMD", "clamdscan", "--config-file=/etc/clamav/clamd.conf", "--ping=1"]
    volumes:
      - ./clamd.staging.conf:/etc/clamav/clamd.conf:ro
      - ./freshclam.staging.conf:/etc/clamav/freshclam.conf:ro
      - pdf_scanner_socket:/tmp
      - pdf_signatures:/var/lib/clamav
    networks: [pdf-signatures]

volumes:
  capture_mail:
  pdf_objects:
  pdf_scanner_socket:
  pdf_signatures:

networks:
  pdf-signatures:
